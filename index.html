
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Univers éducatif</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5fb;
      color: #193657;
    }
    header {
      background: linear-gradient(135deg, #123b70, #087fbd);
      color: white;
      padding: 30px 16px;
      text-align: center;
    }
    header h1 { font-size: 30px; margin: 8px 0 18px; }
    header p { font-size: 17px; line-height: 1.6; }
    nav {
      background: white;
      padding: 14px;
      text-align: center;
      position: sticky;
      top: 0;
    }
    nav a {
      color: #164c83;
      text-decoration: none;
      font-weight: bold;
      margin: 0 12px;
    }
    main { max-width: 1000px; margin: auto; padding: 20px 14px; }
    .outils {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd6e2;
      border-radius: 12px;
      background: white;
      font-size: 16px;
    }
    h2 { text-align: center; margin: 28px 0; }
    #liste {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .carte {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px #19365712;
    }
    .carte img {
      display: block;
      width: 100%;
      height: 300px;
      object-fit: contain;
      background: #e7edf5;
      cursor: pointer;
    }
    .infos { padding: 16px; }
    .infos h3 { margin: 0 0 10px; }
    .infos p { color: #586a80; }
    .bouton {
      display: inline-block;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      background: #087fbd;
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      text-align: center;
      padding: 30px 15px;
      background: white;
      border-radius: 16px;
      line-height: 1.7;
    }
    footer {
      text-align: center;
      padding: 24px;
      background: #123b70;
      color: white;
      margin-top: 40px;
    }
    #visionneuse {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000e;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    #visionneuse img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
    }
    #fermer {
      position: absolute;
      right: 18px;
      top: 15px;
      color: white;
      font-size: 30px;
      background: none;
      border: 0;
    }
    @media (min-width: 600px) {
      .outils { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header id="accueil">
  <h1>📚 Mon Univers éducatif</h1>
  <p>Révise, apprends et consulte les épreuves du lycée directement en images.</p>
</header>

<nav>
  <a href="#accueil">Accueil</a>
  <a href="#epreuves">Épreuves</a>
  <a href="#cours">Cours</a>
</nav>

<main>
  <section id="epreuves">
    <h2>📖 Les épreuves du lycée</h2>
    <div class="outils">
      <input id="recherche" type="search"
        placeholder="Rechercher une épreuve...">
      <select id="niveau">
        <option value="">Tous les niveaux</option>
        <option value="Seconde">Seconde</option>
        <option value="Première">Première</option>
        <option value="Terminale">Terminale</option>
      </select>
    </div>
    <div id="liste"></div>
    <div id="message">Chargement des épreuves...</div>
  </section>

  <section id="cours">
    <h2>🎓 Espace cours</h2>
    <div id="messageCours" style="text-align:center">
      Les cours seront ajoutés prochainement.
    </div>
  </section>
</main>

<div id="visionneuse">
  <button id="fermer" aria-label="Fermer">×</button>
  <img id="grandeImage" alt="Sujet d'épreuve agrandi">
</div>

<footer>
  <p>Mon Univers éducatif — Apprendre et réussir ensemble.</p>
</footer>

<script>
const fichiers = [
  "IMG_20261024_010958_875.jpg",

  "IMG_20261024_012242_779.jpg",
  "IMG_20261024_012250_462.jpg",
  "IMG_20261024_012300_099.jpg",
  "IMG_20261024_012322_160.jpg",
  "IMG_20261024_012330_045.jpg",
  "IMG_20261024_012332_329.jpg",
  "IMG_20261024_012350_083.jpg",
  "IMG_20261024_012412_742.jpg",
  "IMG_20261024_012428_299.jpg",
  "IMG_20261024_012457_371.jpg"
];

const liste = document.getElementById("liste");
const message = document.getElementById("message");
const recherche = document.getElementById("recherche");
const niveau = document.getElementById("niveau");

function afficher() {
  liste.innerHTML = "";
  const terme = recherche.value.toLowerCase().trim();
  const choix = niveau.value;
  let total = 0;

  fichiers.forEach((nom, index) => {
    const titre = "Épreuve " + (index + 1);
    const texte = (titre + " " + nom).toLowerCase();

    if (terme && !texte.includes(terme)) return;
    if (choix) return;

    const carte = document.createElement("article");
    carte.className = "carte";

    const image = document.createElement("img");
    image.src = nom;
    image.alt = titre;
    image.loading = "lazy";

    image.onerror = () => {
      carte.remove();
      message.hidden = liste.children.length > 0;
      message.textContent =
        "Certaines photos n'ont pas pu être chargées. Vérifie leurs noms sur GitHub.";
    };

    image.onclick = () => {
      document.getElementById("grandeImage").src = nom;
      document.getElementById("visionneuse").style.display = "flex";
    };

    const infos = document.createElement("div");
    infos.className = "infos";

    const h3 = document.createElement("h3");
    h3.textContent = titre;

    const p = document.createElement("p");
    p.textContent = nom;

    const lien = document.createElement("a");
    lien.className = "bouton";
    lien.href = nom;
    lien.target = "_blank";
    lien.rel = "noopener";
    lien.textContent = "Voir le sujet";

    infos.append(h3, p, lien);
    carte.append(image, infos);
    liste.appendChild(carte);
    total++;
  });

  message.hidden = total > 0;
  if (!total) {
    message.textContent = choix
      ? "Le niveau ne peut pas encore être déterminé pour ces photos."
      : "Aucune épreuve trouvée. Vérifie les noms des fichiers.";
  }
}

recherche.addEventListener("input", afficher);
niveau.addEventListener("change", afficher);

document.getElementById("fermer").onclick = () => {
  document.getElementById("visionneuse").style.display = "none";
  document.getElementById("grandeImage").src = "";
};

document.getElementById("visionneuse").onclick = event => {
  if (event.target.id === "visionneuse") {
    document.getElementById("visionneuse").style.display = "none";
  }
};

afficher();
</script>
</body>
  </html>
